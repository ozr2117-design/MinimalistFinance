name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Build Android APKs (Release & Debug)
      run: |
        gradle assembleRelease assembleDebug --stacktrace
        cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/shubu-v1.0.9.apk || true

    - name: Upload Release APK (Signed for App Stores)
      uses: actions/upload-artifact@v4
      with:
        name: 数簿-release-apk
        path: app/build/outputs/apk/release/*.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: 数簿-app-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Release APK to GitHub Release (on tag or manual)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk

